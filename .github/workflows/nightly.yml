# Nightly tier (DESIGN.md 2.6): statistical and integration tests, <= 30 min.
#
# The schedule stays off while the repository is private (Actions minutes); run it by hand
# ("Run workflow", input "os"). When the repository is public, re-enable the schedule:
#   schedule:
#     - cron: "17 21 * * *"
name: nightly

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner OS for this manual run"
        type: choice
        options: [ubuntu-latest, windows-latest, both]
        default: ubuntu-latest

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(inputs.os == 'both' && '["ubuntu-latest", "windows-latest"]'
          || format('["{0}"]', inputs.os || 'ubuntu-latest')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NUMBA_DISABLE_INTEL_SVML: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Versions
        run: python -m pip list
      - name: Tests (nightly tier)
        run: python tools/tasks.py nightly --durations=30
