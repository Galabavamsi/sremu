# Nightly tier (DESIGN.md 2.6): statistical and integration tests, <= 30 min.
# Committed now; used only once the repository is public.
name: nightly

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NUMBA_DISABLE_INTEL_SVML: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests (nightly tier)
        run: python tools/tasks.py nightly
