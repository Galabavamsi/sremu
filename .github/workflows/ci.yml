# CI tier (DESIGN.md 2.6). Committed now; used only once the repository is public.
# CI timing is never quoted in the paper.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NUMBA_DISABLE_INTEL_SVML: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python tools/tasks.py lint
      - name: Tests (CI tier)
        run: python tools/tasks.py ci
      - name: CLI smoke
        run: sremu info
