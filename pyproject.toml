[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sremu"
version = "0.1.0.dev0"
description = "Smart Radio Environment EMUlator: an open-source, software-only, IQ-level radio-environment emulator with timed RIS control"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Pending" }
authors = [{ name = "Galaba Vamsi" }]
keywords = ["RIS", "reconfigurable intelligent surface", "emulator", "SDR", "IQ", "wireless"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
# Core dependencies, DESIGN.md section 2.4. Changing this list needs a CCR (section 14.3).
dependencies = [
    "numpy>=2.2",
    "scipy>=1.14",
    "numba>=0.62",
    "pydantic>=2.12",
    "pyyaml>=6",
    "pyzmq>=27",
    "typer>=0.12",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10"]
ml = ["gymnasium>=1.0"]
sigmf = ["sigmf>=1.2"]
parquet = ["pyarrow>=15"]
gpu = ["torch>=2.4"]

[project.scripts]
sremu = "sremu.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Data that ships inside the package (built-in response tables, JSON schemas, built-in YAML).
# Repository-root folders such as scenarios/ and data/states/ are outside src/ and are not
# part of a wheel; see CONTRIBUTING.md ("Package data").
sremu = [
    "py.typed",
    "physics/tables/*.yaml",
    "physics/tables/*.yml",
    "physics/tables/*.csv",
    "physics/tables/*.json",
    "transport/schema/*.json",
    "scenario/schemas/*.json",
    "scenario/builtin/*.yaml",
    "scenarios/*.yaml",
    "data/states/*.yaml",
]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "unit: fast deterministic unit tests (CI tier)",
    "physics: physics analytic oracles PH-xx (CI tier)",
    "runtime: runtime invariants and oracles I/RT-xx (CI tier)",
    "io: interface tests IO-xx (CI tier)",
    "golden: MATLAB code-to-code goldens G1-G8, Python side (CI tier)",
    "statistical: seeded Monte Carlo oracles ST-xx (nightly tier)",
    "integration: multi-process (two-process) integration tests (nightly tier)",
    "validation_smoke: quick smoke runs of the V-* validation studies (nightly tier)",
    "experimental: experimental modules outside every gate",
    "needs_private_data: needs $SREMU_PRIVATE_DATA; skipped when it is absent",
    "slow: long-running test; excluded from quick local runs with -m 'not slow'",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["runs", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplify
    "NPY",           # numpy rules; NPY002 bans the legacy global np.random API
    "PT",            # pytest style
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Greek letters and math symbols are allowed in text
    "SIM108",                      # ternary rewrites are not always clearer
    "UP040",                       # keep runtime-transparent TypeAlias aliases (pydantic, isinstance)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT011", "PT018", "SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["sremu"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/sremu"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "sremu.units",
    "sremu.timebase",
    "sremu.errors",
    "sremu.contracts",
    "sremu.cli",
    "sremu.testing.*",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numba.*", "llvmlite.*", "scipy.*", "zmq.*", "yaml.*", "sigmf.*", "gymnasium.*", "torch.*"]
ignore_missing_imports = true
